[package]
name = "nearfield-app"
version = "0.1.0"
edition = "2021"
description = "Daily preprint digest, ranked by distance from Munich"

# Not a member of the repo's root workspace: Tauri manages its own target dir
# and the Android build invokes cargo from this directory.
[workspace]

[lib]
name = "nearfield_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nearfield-core = { path = "../../crates/nearfield-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
tracing = "0.1"
tauri-plugin-geolocation = "2.5.0"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# Launching Android's package installer needs a real Intent with a
# FileProvider URI and a read grant, which no Tauri plugin exposes.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
