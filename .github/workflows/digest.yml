name: digest

# arXiv sends each evening's list at 20:00 US Eastern, but its RSS feeds only
# carry it hours later: the 29 October list was in them at 06:39 UTC the next
# morning. So the digest for a day is built the following morning, aiming for
# 08:00 in Munich.
#
# Cron runs in UTC and GitHub often starts scheduled runs late, so instead of
# one run this tries every half hour from 06:07 to 10:37 UTC (07:07-11:37 in
# Munich in winter, 08:07-12:37 in summer). Each try first asks
# scripts/new-announcement.sh, in seconds, whether the feeds hold a list that
# has no digest yet, and stops there if not; only the first try that finds one
# builds it. A manual run always builds.
#
# Once a week, early on Sunday when no new list is due, every published day is
# rerun offline: no arXiv fetches and no OpenAlex calls, only the author cache
# that each daily run grows and the offline index, so older days pick up
# authors that later runs have placed, for free.
#
# OpenAlex allows $1 a day, reset at midnight UTC, and a new list does not
# always need all of it; on Saturday and Sunday, when arXiv has sent no list,
# nothing spends it at all. So a run each day after the morning window first
# builds the day's list if the tries above have not (they can start hours
# late), then asks OpenAlex what is left of the day's allowance and spends it
# on published days, newest first: it looks up the authors earlier runs had no
# budget for, and reads more papers.
on:
  schedule:
    - cron: "7,37 6-10 * * *"
    # Keep in step with WEEKLY below.
    - cron: "17 3 * * 0"
    # Keep in step with SPEND below. After the daily window.
    - cron: "47 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD). Blank = today. With rerun, the published day to improve."
        required: false
      rerun:
        description: "Rerun a published day: keep its papers, place more authors and read more papers. Needs a date."
        type: boolean
        default: false
      prefetch:
        description: "How many of the nearest papers to read fully, for affiliations and emails."
        required: false
        default: "200"
      origin:
        description: "Measure from here: a place name, lat,lon or Label@lat,lon. Blank = the NEARFIELD_ORIGIN variable."
        required: false
      prefetch_unplaced:
        description: "Unplaced papers to read for their affiliations."
        required: false
        default: "250"
      spend:
        description: "Only spend what is left of today's OpenAlex allowance on published days, as the 11:47 run does."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

env:
  WEEKLY: ${{ github.event.schedule == '17 3 * * 0' }}
  SPEND: ${{ github.event.schedule == '47 11 * * *' || inputs.spend == true }}

jobs:
  check:
    if: ${{ github.event_name == 'schedule' && github.event.schedule != '17 3 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new: ${{ steps.feeds.outputs.new }}
      date: ${{ steps.feeds.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            data
            scripts
      - name: Is there a list without a digest?
        id: feeds
        run: bash scripts/new-announcement.sh | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    # `always()` lets a manual run or the weekly rerun, where check is
    # skipped, through. The run that spends the rest of the day's allowance
    # always builds, and harvests first if check found a list.
    if: ${{ always() && (github.event_name != 'schedule' || github.event.schedule == '17 3 * * 0' || github.event.schedule == '47 11 * * *' || needs.check.outputs.new == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Build the pipeline
        run: cargo build --release -p nearfield-cli

      # The index is a single 550 MB file, so it cannot live in the repo:
      # GitHub rejects any file over 100 MB, and LFS's free tier is 1 GB of
      # bandwidth a month — one nightly run would spend half of it. The
      # Actions cache holds 10 GB per repo, and a nightly job keeps the entry
      # warm so it is never evicted for inactivity.
      #
      # Keyed by quarter because that is the snapshot's release cadence: a new
      # quarter misses, rebuilds once, and every night after that restores.
      # Only the index is cached, not the 5.5 GB of extracts it was built
      # from — those are worth re-fetching once a quarter to keep the cache
      # small.
      - name: Work out the index cache key
        id: idx
        run: |
          echo "quarter=$(date -u +%Y)Q$(( ($(date -u +%-m) - 1) / 3 + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Restore the offline author index
        id: index-cache
        uses: actions/cache@v6
        with:
          path: cache/snapshot/authors.idx
          key: authors-index-mw1-${{ steps.idx.outputs.quarter }}

      - name: Build the author index
        if: ${{ steps.index-cache.outputs.cache-hit != 'true' }}
        env:
          NEARFIELD_CONTACT: ${{ secrets.NEARFIELD_CONTACT }}
        run: |
          # ~5.5 GB fetched and ~2.5 minutes to build; only on a cache miss.
          # --min-works 1 keeps the single-work authors: measured 89.0%
          # of a real day's names against 87.3% at the default of 2, for
          # 665 MB instead of 525 MB. Worth it against a 10 GB cache.
          ./target/release/nearfield index-authors --dir cache/snapshot --min-works 1
          # The extracts have served their purpose and would bloat the cache.
          find cache/snapshot -name '*.jsonl*' -delete || true
          ls -la cache/snapshot/authors.idx

      - name: Rerun every published day offline
        if: ${{ env.WEEKLY == 'true' }}
        env:
          NEARFIELD_CONTACT: ${{ secrets.NEARFIELD_CONTACT }}
          NEARFIELD_ORIGIN: ${{ vars.NEARFIELD_ORIGIN }}
        run: |
          mkdir -p work
          for f in data/20??-??-??.json; do
            day=$(basename "$f" .json)
            echo "::group::$day"
            # No budget, no lookups and no reading: the cache and the index
            # answer for free. A failed day is reported and the rest go on.
            ./target/release/nearfield run --date "$day" --reuse-harvest \
              --snapshot cache/snapshot/authors.idx \
              --budget 0 --affiliation-budget 0 --max-lookups 0 \
              --prefetch 0 --prefetch-unplaced 0 \
              || echo "::warning::rerun of $day failed"
            echo "::endgroup::"
          done

      - name: Harvest, geolocate and rank
        if: ${{ env.WEEKLY != 'true' && (env.SPEND != 'true' || needs.check.outputs.new == 'true') }}
        env:
          # Free key, own $1/day budget. Without it OpenAlex throttles the
          # whole runner IP to a shared $0.10/day and most papers stay unplaced.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NEARFIELD_CONTACT: ${{ secrets.NEARFIELD_CONTACT }}
          NEARFIELD_ORIGIN: ${{ vars.NEARFIELD_ORIGIN }}
        run: |
          mkdir -p work
          ./target/release/nearfield run \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.rerun && '--reuse-harvest' || '' }} \
            --prefetch "${{ inputs.prefetch || '200' }}" \
            ${{ inputs.origin && format('--origin "{0}"', inputs.origin) || '' }} \
            --snapshot cache/snapshot/authors.idx \
            --prefetch-unplaced "${{ inputs.prefetch_unplaced || '250' }}" \
            --max-lookups 4000

      - name: Spend the rest of the day's allowance on published and past days
        if: ${{ env.SPEND == 'true' }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NEARFIELD_CONTACT: ${{ secrets.NEARFIELD_CONTACT }}
          NEARFIELD_ORIGIN: ${{ vars.NEARFIELD_ORIGIN }}
        run: |
          mkdir -p work
          # What OpenAlex itself says is left of today's allowance, so every
          # spend counts: the morning's build, manual runs, affiliations. A
          # free lookup by id carries it in a header.
          # One unanswered request once stopped a run with $0.52 unspent, so
          # it is asked up to five times. Without -f, so that a refusal's
          # headers, which say $0 left, still count as an answer.
          left() {
            local usd try
            for try in 1 2 3 4 5; do
              usd=$(curl -sS -D - -o /dev/null --max-time 30 \
                "https://api.openalex.org/authors/A5023888391?api_key=$OPENALEX_API_KEY" \
                | tr -d '\r' \
                | awk -F': ' 'tolower($1) == "x-ratelimit-remaining-usd" { print $2 }' \
                || true)
              if [[ -n "$usd" ]]; then echo "$usd"; return; fi
              echo "no budget in OpenAlex's answer (try $try of 5)" >&2
              sleep $((try * 10))
            done
          }
          start=$SECONDS
          # Run one day on all that is left. Fails, to stop the caller, under
          # a cent (a search costs a tenth of one), when the header is
          # missing, or after 80 minutes, inside the job's timeout.
          spend_on() {
            local day=$1; shift
            usd=$(left)
            echo "OpenAlex: \$${usd:-?} left today"
            awk -v l="${usd:-0}" 'BEGIN { exit !(l >= 0.01) }' || return 1
            (( SECONDS - start <= 80 * 60 )) || return 1
            echo "::group::$day $*"
            # All of it, a twentieth held for affiliations read off papers.
            ./target/release/nearfield run --date "$day" "$@" \
              --snapshot cache/snapshot/authors.idx \
              --budget "$(awk -v l="$usd" 'BEGIN { printf "%.3f", l * 0.95 }')" \
              --affiliation-budget "$(awk -v l="$usd" 'BEGIN { printf "%.3f", l * 0.05 }')" \
              --prefetch 200 --prefetch-unplaced 250 --max-lookups 4000 \
              || echo "::warning::run of $day $* failed"
            echo "::endgroup::"
          }

          # Published days first, newest first.
          for f in $(ls -r data/20??-??-??.json); do
            spend_on "$(basename "$f" .json)" --reuse-harvest || exit 0
          done

          # Then further back: rebuild the list before the oldest digest from
          # arXiv's search API. Friday and Saturday have no list to rebuild.
          while true; do
            oldest=$(ls data/20??-??-??.json | head -1 | xargs basename -s .json)
            day=$(date -u -d "$oldest -1 day" +%F)
            while [[ $(date -u -d "$day" +%u) == 5 || $(date -u -d "$day" +%u) == 6 ]]; do
              day=$(date -u -d "$day -1 day" +%F)
            done
            spend_on "$day" --backfill || exit 0
            # A day that wrote nothing would be tried again forever.
            if [[ ! -f "data/$day.json" ]]; then
              echo "::warning::rebuilding $day wrote no digest; stopping"
              break
            fi
          done

      - name: Commit the day's digest and the warmed caches
        run: |
          git config user.name  "nearfield"
          git config user.email "actions@users.noreply.github.com"
          # Both workflows push to main, and a human may too, so a plain
          # push races. Rebase onto whatever landed and retry.
          push_with_retry() {
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$1"; then return 0; fi
              echo "push rejected (attempt $attempt); rebasing onto origin/$1"
              if ! git pull --rebase --autostash origin "$1"; then
                # Leaving a half-finished rebase makes the next attempt fail
                # for a different reason and hides the real one.
                git rebase --abort 2>/dev/null || true
                return 1
              fi
              sleep $((attempt * 3))
            done
            return 1
          }
          git add data cache
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            if [[ "$WEEKLY" == "true" ]]; then
              git commit -m "digest: offline rerun of every day, $(date -u +%F)"
            elif [[ "$SPEND" == "true" ]]; then
              git commit -m "digest: $(date -u +%F), the rest of the day's lookups"
            else
              git commit -m "digest: $(date -u +%F)"
            fi
            push_with_retry "${{ github.event.repository.default_branch }}"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Assemble the site
        run: bash scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Notify the phone
        if: ${{ env.NTFY_TOPIC != '' && env.WEEKLY != 'true' && (env.SPEND != 'true' || needs.check.outputs.new == 'true') }}
        run: |
          curl -fsS \
            -H "Title: Nearfield" \
            -H "Tags: page_facing_up" \
            -H "Click: https://hilll.dev/nearfield/" \
            -d "$(cat work/summary.txt)" \
            "https://ntfy.sh/${NTFY_TOPIC}" || echo "notification failed, continuing"

  deploy:
    needs: build
    # Without this, a skipped check (on a manual run) skips the deploy too.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
