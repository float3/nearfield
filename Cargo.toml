[workspace]
members = ["crates/nearfield-core", "crates/nearfield-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arrow-array = "60"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
# Only the Snappy codec: that is what the OpenAlex snapshot is written with,
# and the default feature set drags in zstd, brotli and lz4 for nothing.
parquet = { version = "60", default-features = false, features = ["arrow", "async", "snap"] }
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
